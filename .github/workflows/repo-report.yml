name: repo-report

# Manual, PER-COURSE refresh. Instructor: Actions -> repo-report -> Run workflow -> enter `course`
# (e.g. cs120; case-insensitive). Rebuilds ONLY that course's per-assignment detail files (with
# autograder pass/fail + score) + the index repo-report.md + README.md. PRIVATE admin repo.
# Reading OTHER repos' Actions needs ORG_REPO_TOKEN (a PAT with org actions:read) — the default
# GITHUB_TOKEN is scoped to THIS repo only and cannot read student repos' runs.
on:
  workflow_dispatch:
    inputs:
      course:
        description: "Course to rebuild (e.g. cs120; case-insensitive). Blank = ALL courses (slow)."
        required: false
        default: ""
      semester:
        description: "Term to view (e.g. sp26). Blank = CURRENT term. A past term reads log/archive/<term>/ and writes separate files (does not touch the live README/index)."
        required: false
        default: ""

# Serialize ALL admin report commits (repo-report + roster share this group) so two runs never
# push to the same branch at once (a concurrent push is rejected non-fast-forward).
concurrency:
  group: classroom-admin-report
  cancel-in-progress: false

permissions:
  contents: write   # commit report files (uses checkout's default token)

jobs:
  repo-report:
    runs-on: ubuntu-latest
    env:
      ORG: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}   # cross-repo actions:read for `gh api`
      ONLY: ${{ inputs.course }}
      SEM: ${{ inputs.semester }}
    steps:
      - uses: actions/checkout@v4

      - name: Build repo-report (index + per course/assignment detail with pass/fail + score)
        run: |
          set -uo pipefail
          STAMP="$(TZ='America/Los_Angeles' date '+%Y-%m-%d %I:%M %p %Z')"
          mkdir -p reports
          # ---- term scoping: blank SEM = CURRENT term (log/); a past term reads log/archive/<sem>/ ----
          SEM="$(printf '%s' "${SEM:-}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$SEM" ] && [ -d "log/archive/$SEM" ]; then
            SRC="log/archive/$SEM"; PAST=1; PFX="${SEM}-"; IDXFILE="repo-report-${SEM}.md"
          else
            SRC="log"; PAST=0; PFX=""; IDXFILE="repo-report.md"
          fi
          HAVE="$(find ${SRC} -maxdepth 1 -name '*.json' 2>/dev/null | wc -l | tr -d ' ')"
          TAB="$(printf '\t')"
          # course matching is CASE-INSENSITIVE: normalize the input + every course to lowercase
          # (so `COMSC240` and `comsc240` are one course).
          ONLY="$(printf '%s' "${ONLY:-}" | tr '[:upper:]' '[:lower:]')"

          # validate the course input: a typo must FAIL loudly, not silently produce nothing
          if [ -n "${ONLY}" ] && [ "$HAVE" -gt 0 ] && ! jq -r '.course|ascii_downcase' ${SRC}/*.json 2>/dev/null | sort -u | grep -qx "${ONLY}"; then
            echo "::error::course '${ONLY}' not found. Valid: $(jq -r '.course|ascii_downcase' ${SRC}/*.json 2>/dev/null | sort -u | paste -sd' ' -)"
            exit 1
          fi

          # ---- build the per-course index BODY once (counts + open links), reused below ----
          : > /tmp/idx_body.md
          if [ "$HAVE" -gt 0 ]; then
            jq -r '.course|ascii_downcase' ${SRC}/*.json | sort -u | while read -r course; do
              [ -n "$course" ] || continue
              { echo ""; echo "## ${course}"; echo ""; echo "| Assignment | Submitted | Detail |"; echo "|---|---|---|"; } >> /tmp/idx_body.md
              jq -r --arg c "$course" 'select((.course|ascii_downcase)==$c) | .assignment' ${SRC}/*.json | sort -u | while read -r assign; do
                [ -n "$assign" ] || continue
                n="$(jq -r --arg c "$course" --arg a "$assign" 'select((.course|ascii_downcase)==$c and .assignment==$a) | .username' ${SRC}/*.json | wc -l | tr -d ' ')"
                echo "| ${assign} | ${n} | [open](reports/${PFX}${course}-${assign}.md) |" >> /tmp/idx_body.md
              done
            done
          fi

          # ---- repo-report.md = plain index (header + body) ----
          {
            echo "# Submission Report — Index"
            echo ""
            echo "_Generated ${STAMP} — refresh: Actions -> repo-report -> Run workflow (enter a course). Total repos: **${HAVE}**._"
            cat /tmp/idx_body.md
          } > "${IDXFILE}"

          # ---- README.md = manual/guide + the SAME index (CURRENT term only; a past-term run skips it) ----
          # (GENERATED every run — edit the guide text in this workflow, not README directly.)
          if [ "$PAST" = 0 ]; then
          {
            echo "# ${ORG} — Classroom Hub (admin · PRIVATE)"
            echo ""
            echo "> ⛔ **PRIVATE — never make this repo public.** It stores PII: \`roster/<username>.json\` (student name / email / registered) and \`log/<repo>.json\` (per-repo provisioning records). Written by the \`${ORG}/classroom\` workflows via \`ORG_PAT\`."
            echo ""
            echo "## What's here"
            echo "- **This page** = live submission status per course (autograder **pass/fail + score**). Click **open** for a per-assignment detail."
            echo "- [\`roster.md\`](roster.md) — student roster per course; each name links to that student's repo list."
            echo "- \`reports/\` — generated detail pages · \`log/\`, \`roster/\` — raw PII data (do not share)."
            echo ""
            echo "## Refresh (manual, per course)"
            echo "- **Actions → \`repo-report\` → Run workflow → enter a course** (e.g. \`cs120\`; case-insensitive) — rebuilds THAT course's pass/fail + score."
            echo "- **Actions → \`roster\` → Run workflow → enter a course** — rebuilds that course's roster."
            echo "- **Past term**: enter \`semester\` (e.g. \`sp26\`) — reads archived \`log/archive/<term>/\` into \`repo-report-<term>.md\` (current term needs no semester; never overwrites this page)."
            echo "- Per-course on purpose: only the course you run is rebuilt (no all-course overhead)."
            echo ""
            echo "## How to read the status"
            echo "- **Result**: ✅ pass / ❌ fail = the latest push run's autograder conclusion."
            echo "- **Score**: autograder \`totalPoints/maxPoints\` parsed from the run log."
            echo ""
            echo "_Status generated ${STAMP} · total repos: **${HAVE}**._"
            echo ""
            echo "---"
            echo "# Submission status"
            cat /tmp/idx_body.md
          } > README.md
          fi

          # ---- autograder result for one repo -> prints "PF<TAB>SCORE" ----
          autograder_result () {
            repo="$1"; runs=""; runid=""; concl=""; pf=""; score="—"; tp=""; mp=""
            runs="$(gh api "/repos/${ORG}/${repo}/actions/runs?event=push&per_page=1" 2>/dev/null || echo '{}')"
            concl="$(printf '%s' "$runs" | jq -r '.workflow_runs[0].conclusion // "none"')"
            runid="$(printf '%s' "$runs" | jq -r '.workflow_runs[0].id // empty')"
            case "$concl" in
              success) pf="✅ pass";;
              failure) pf="❌ fail";;
              none)    pf="— no run";;
              *)       pf="… ${concl}";;
            esac
            if [ -n "$runid" ]; then
              z="$(mktemp)"                              # unique per call -> parallel-safe
              if gh api "/repos/${ORG}/${repo}/actions/runs/${runid}/logs" > "$z" 2>/dev/null && [ -s "$z" ]; then
                L="$(unzip -p "$z" 2>/dev/null)"         # decompress once
                tp="$(printf '%s' "$L" | grep -oE '"totalPoints": *[0-9]+' | tail -1 | grep -oE '[0-9]+' || true)"
                mp="$(printf '%s' "$L" | grep -oE '"maxPoints": *[0-9]+'   | tail -1 | grep -oE '[0-9]+' || true)"
                [ -n "$tp" ] && [ -n "$mp" ] && score="${tp}/${mp}"
              fi
              rm -f "$z"
            fi
            printf '%s\t%s' "$pf" "$score"
          }

          # build one markdown row, preserving sort index (for parallel reassembly)
          build_row () {
            IFS="$TAB" read -r idx username name repo <<< "$1"
            [ -n "$repo" ] || return 0
            res="$(autograder_result "$repo")"; pf="${res%%${TAB}*}"; score="${res##*${TAB}}"
            printf '%s\t| %s | %s | %s | %s | [%s](https://github.com/%s/%s) |\n' \
              "$idx" "$username" "$name" "$pf" "$score" "$repo" "$ORG" "$repo"
          }
          export -f autograder_result build_row; export ORG TAB

          # ---- per course/assignment detail — ONLY the chosen course (blank = all) ----
          if [ "$HAVE" -gt 0 ]; then
            jq -r '"\(.course|ascii_downcase)\t\(.assignment)"' ${SRC}/*.json | sort -u | while IFS="$TAB" read -r course assign; do
              [ -n "$course" ] || continue
              if [ -n "${ONLY}" ] && [ "${ONLY}" != "${course}" ]; then continue; fi
              echo "building ${course}/${assign} ..."
              {
                echo "# ${course} / ${assign}"
                echo ""
                echo "_Generated ${STAMP}_ · [← index](../${IDXFILE})"
                echo ""
                echo "| Username | Name | Result | Score | Repo |"
                echo "|---|---|---|---|---|"
                jq -r --arg c "$course" --arg a "$assign" '
                  select((.course|ascii_downcase)==$c and .assignment==$a) | "\(.username)\t\(.name)\t\(.repo)"' ${SRC}/*.json \
                  | awk -F"$TAB" '{n=split($2,a," "); print tolower(a[n]) "\t" $0}' | sort -f | cut -f2- \
                  | awk -F"$TAB" '{print NR"\t"$0}' \
                  | xargs -d '\n' -P 8 -n1 bash -c 'build_row "$1"' _ \
                  | sort -t"$TAB" -k1,1n | cut -f2-
              } > "reports/${PFX}${course}-${assign}.md"
            done
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "reports unchanged"
          else
            git commit -m "repo-report: refresh ${STAMP} (course=${ONLY:-all} term=${SEM:-current})"
            # push with retry: if the remote advanced between checkout and push, rebase + retry
            n=0
            until git push 2>/dev/null; do
              n=$((n+1)); [ "$n" -gt 4 ] && { echo "::error::git push failed after $n retries"; exit 1; }
              echo "push rejected — syncing remote then retrying ($n)..."
              git pull --rebase --autostash --no-edit 2>/dev/null || true
              sleep $((n*2))
            done
          fi
